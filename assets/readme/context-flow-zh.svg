<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TabSlate 浏览工作流</title>
  <desc id="desc">三个步骤：查看打开的标签页，把有用页面整理进集合，然后在工作恢复时搜索或恢复保存的标签组。</desc>

  <rect width="1200" height="360" rx="28" fill="#F5F8FF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="64" y="70" fill="#22304A" font-size="42" font-weight="750" letter-spacing="-1.1">让浏览上下文始终触手可及。</text>
    <text x="64" y="106" fill="#5A6C8B" font-size="22">从当前标签页开始，整理为日后能迅速找回和恢复的空间。</text>

    <g transform="translate(64 158)">
      <rect width="304" height="142" rx="18" fill="#FFFFFF" stroke="#C9D5EB" stroke-width="2"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#E0EAFF"/>
      <path d="M33 35H50M33 43H46M33 51H42" stroke="#416FDC" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="38" fill="#647797" font-size="18" font-weight="700" letter-spacing="1.6">从当前开始</text>
      <text x="78" y="64" fill="#16233A" font-size="25" font-weight="750">查看打开的标签页</text>
      <text x="20" y="104" fill="#526582" font-size="18">先看清正在进行的工作。</text>
      <text x="20" y="128" fill="#526582" font-size="18">关闭重复页面，避免继续堆积。</text>
    </g>

    <path d="M390 229H442" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M430 217L444 229L430 241" fill="none" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(462 158)">
      <rect width="304" height="142" rx="18" fill="#FFFFFF" stroke="#C9D5EB" stroke-width="2"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#E9F8F2"/>
      <path d="M32 34H50V52H32Z" fill="none" stroke="#2E9C72" stroke-width="3" stroke-linejoin="round"/>
      <path d="M32 40H50" stroke="#2E9C72" stroke-width="3"/>
      <text x="78" y="38" fill="#647797" font-size="18" font-weight="700" letter-spacing="1.6">让它可被找到</text>
      <text x="78" y="64" fill="#16233A" font-size="25" font-weight="750">整理浏览上下文</text>
      <text x="20" y="104" fill="#526582" font-size="18">将页面存入工作区、</text>
      <text x="20" y="128" fill="#526582" font-size="18">集合和书签。</text>
    </g>

    <path d="M788 229H840" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M828 217L842 229L828 241" fill="none" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(860 158)">
      <rect width="276" height="142" rx="18" fill="#1A2940"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#334A78"/>
      <path d="M33 33H48V51H33Z" fill="none" stroke="#BFD6FF" stroke-width="3" stroke-linejoin="round"/>
      <path d="M37 43L41 47L48 38" fill="none" stroke="#BFD6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="38" fill="#AEBED7" font-size="18" font-weight="700" letter-spacing="1.6">快速继续</text>
      <text x="78" y="64" fill="#F8FAFC" font-size="25" font-weight="750">恢复工作</text>
      <text x="20" y="104" fill="#C4D0E6" font-size="18">搜索标签页和书签，</text>
      <text x="20" y="128" fill="#C4D0E6" font-size="18">或恢复保存的分组。</text>
    </g>
  </g>
</svg>
