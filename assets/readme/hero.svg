<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TabSlate — a focused workspace for your browser</title>
  <desc id="desc">A visual summary of TabSlate: open tabs, bookmarks, and saved groups organized inside a new-tab workspace.</desc>

  <rect width="1200" height="420" rx="28" fill="#101827"/>
  <path d="M68 104H642" stroke="#263349" stroke-width="2"/>
  <path d="M68 362H1132" stroke="#263349" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="68" y="72" fill="#91A4C4" font-size="18" font-weight="700" letter-spacing="2.6">A NEW TAB WORKSPACE</text>
    <text x="68" y="176" fill="#F8FAFC" font-size="82" font-weight="750" letter-spacing="-3.5">TabSlate</text>
    <text x="68" y="228" fill="#C4D0E6" font-size="28" font-weight="500">A focused workspace for your browser.</text>
    <text x="68" y="268" fill="#91A4C4" font-size="20">Organize tabs, bookmarks, and saved groups</text>
    <text x="68" y="294" fill="#91A4C4" font-size="20">without losing context.</text>

    <g transform="translate(68 316)">
      <rect width="126" height="34" rx="17" fill="#1C2A42" stroke="#385A91"/>
      <text x="63" y="23" text-anchor="middle" fill="#BFD6FF" font-size="18" font-weight="650">Open tabs</text>
      <rect x="140" width="130" height="34" rx="17" fill="#1C2A42" stroke="#385A91"/>
      <text x="205" y="23" text-anchor="middle" fill="#BFD6FF" font-size="18" font-weight="650">Bookmarks</text>
      <rect x="284" width="148" height="34" rx="17" fill="#1C2A42" stroke="#385A91"/>
      <text x="358" y="23" text-anchor="middle" fill="#BFD6FF" font-size="18" font-weight="650">Saved groups</text>
    </g>

    <g transform="translate(690 48)">
      <rect width="442" height="276" rx="22" fill="#172235" stroke="#334560" stroke-width="2"/>
      <rect x="18" y="18" width="46" height="240" rx="14" fill="#111B2B"/>
      <rect x="31" y="36" width="20" height="20" rx="7" fill="#5B8CFF"/>
      <circle cx="41" cy="94" r="7" fill="#A7F3D0"/>
      <circle cx="41" cy="124" r="7" fill="#F6C76B"/>
      <circle cx="41" cy="154" r="7" fill="#C4B5FD"/>
      <path d="M41 182V228" stroke="#51617B" stroke-width="2" stroke-linecap="round"/>
      <path d="M31 218H51" stroke="#51617B" stroke-width="2" stroke-linecap="round"/>

      <g transform="translate(82 28)">
        <text x="0" y="16" fill="#AEBED7" font-size="18" font-weight="700" letter-spacing="1.4">WORKSPACE</text>
        <rect y="34" width="170" height="46" rx="12" fill="#263753"/>
        <rect x="12" y="47" width="20" height="20" rx="6" fill="#5B8CFF"/>
        <text x="44" y="62" fill="#F8FAFC" font-size="20" font-weight="700">Research</text>
        <text x="148" y="62" fill="#AEBED7" font-size="20">›</text>

        <text x="0" y="116" fill="#AEBED7" font-size="18" font-weight="700" letter-spacing="1.4">COLLECTIONS</text>
        <g fill="#C4D0E6" font-size="19" font-weight="600">
          <text x="8" y="150">⌑  Reading list</text>
          <text x="8" y="184">⌑  Design references</text>
          <text x="8" y="218">⌑  Next release</text>
        </g>
      </g>

      <g transform="translate(274 28)">
        <rect width="148" height="38" rx="11" fill="#1E2C43" stroke="#334560"/>
        <circle cx="20" cy="19" r="6" fill="#A7F3D0"/>
        <text x="36" y="25" fill="#DDE8FA" font-size="18" font-weight="650">Focused now</text>
        <text x="0" y="92" fill="#AEBED7" font-size="18" font-weight="700" letter-spacing="1.4">OPEN TABS</text>

        <g transform="translate(0 110)">
          <rect width="148" height="40" rx="10" fill="#263753"/>
          <rect x="12" y="11" width="18" height="18" rx="5" fill="#5B8CFF"/>
          <text x="42" y="26" fill="#F8FAFC" font-size="18" font-weight="650">Docs</text>
          <rect y="50" width="148" height="40" rx="10" fill="#202E45"/>
          <rect x="12" y="61" width="18" height="18" rx="5" fill="#C4B5FD"/>
          <text x="42" y="76" fill="#F8FAFC" font-size="18" font-weight="650">Project board</text>
          <rect y="100" width="148" height="40" rx="10" fill="#1C2A42"/>
          <rect x="12" y="111" width="18" height="18" rx="5" fill="#F6C76B"/>
          <text x="42" y="126" fill="#F8FAFC" font-size="18" font-weight="650">Draft notes</text>
        </g>
      </g>
    </g>
  </g>
</svg>
