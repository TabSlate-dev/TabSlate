<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TabSlate browsing workflow</title>
  <desc id="desc">A three-step flow: review open tabs, organize useful links into collections, and restore saved tab groups when the work resumes.</desc>

  <rect width="1200" height="360" rx="28" fill="#F5F8FF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="64" y="70" fill="#22304A" font-size="42" font-weight="750" letter-spacing="-1.1">Keep your browsing context within reach.</text>
    <text x="64" y="106" fill="#5A6C8B" font-size="22">Move from the tabs you have open to the places you can find and restore later.</text>

    <g transform="translate(64 158)">
      <rect width="304" height="142" rx="18" fill="#FFFFFF" stroke="#C9D5EB" stroke-width="2"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#E0EAFF"/>
      <path d="M33 35H50M33 43H46M33 51H42" stroke="#416FDC" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="38" fill="#647797" font-size="18" font-weight="700" letter-spacing="1.6">START HERE</text>
      <text x="78" y="64" fill="#16233A" font-size="25" font-weight="750">Review open tabs</text>
      <text x="20" y="104" fill="#526582" font-size="20">See the work already in motion.</text>
      <text x="20" y="128" fill="#526582" font-size="20">Close duplicates before they spread.</text>
    </g>

    <path d="M390 229H442" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M430 217L444 229L430 241" fill="none" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(462 158)">
      <rect width="304" height="142" rx="18" fill="#FFFFFF" stroke="#C9D5EB" stroke-width="2"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#E9F8F2"/>
      <path d="M32 34H50V52H32Z" fill="none" stroke="#2E9C72" stroke-width="3" stroke-linejoin="round"/>
      <path d="M32 40H50" stroke="#2E9C72" stroke-width="3"/>
      <text x="78" y="38" fill="#647797" font-size="18" font-weight="700" letter-spacing="1.6">MAKE IT FINDABLE</text>
      <text x="78" y="64" fill="#16233A" font-size="25" font-weight="750">Organize context</text>
      <text x="20" y="104" fill="#526582" font-size="20">Save pages into workspaces,</text>
      <text x="20" y="128" fill="#526582" font-size="20">collections, and bookmarks.</text>
    </g>

    <path d="M788 229H840" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M828 217L842 229L828 241" fill="none" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(860 158)">
      <rect width="276" height="142" rx="18" fill="#1A2940"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#334A78"/>
      <path d="M33 33H48V51H33Z" fill="none" stroke="#BFD6FF" stroke-width="3" stroke-linejoin="round"/>
      <path d="M37 43L41 47L48 38" fill="none" stroke="#BFD6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="38" fill="#AEBED7" font-size="18" font-weight="700" letter-spacing="1.6">PICK UP FAST</text>
      <text x="78" y="64" fill="#F8FAFC" font-size="25" font-weight="750">Resume the work</text>
      <text x="20" y="104" fill="#C4D0E6" font-size="20">Search tabs and bookmarks,</text>
      <text x="20" y="128" fill="#C4D0E6" font-size="20">or restore a saved group.</text>
    </g>
  </g>
</svg>
